<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="100%" stop-color="#0e131f"/>
    </linearGradient>
    <linearGradient id="redBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f85149" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#da3633" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="greenBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#238636" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="greenBadge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#238636"/>
      <stop offset="100%" stop-color="#2ea043"/>
    </linearGradient>
    <linearGradient id="redBadge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#da3633"/>
      <stop offset="100%" stop-color="#b62324"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; letter-spacing: 0.5px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: #8b949e; }
    .mono-cmd { font-family: "JetBrains Mono", Consolas, "Liberation Mono", Menlo, monospace; font-size: 13px; font-weight: 600; }
    .mono-comment { font-family: "JetBrains Mono", Consolas, "Liberation Mono", Menlo, monospace; font-size: 12px; fill: #7d8590; }
    .tok-red { font-family: "JetBrains Mono", Consolas, monospace; font-size: 13px; font-weight: 700; fill: #ff7b72; }
    .tok-green { font-family: "JetBrains Mono", Consolas, monospace; font-size: 13px; font-weight: 700; fill: #7ee787; }
    .stat-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; }
    .stat-val { font-family: "JetBrains Mono", Consolas, monospace; font-size: 18px; font-weight: 800; }
  </style>

  <!-- Outer Canvas -->
  <rect width="940" height="430" rx="16" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1"/>

  <!-- ==================== LEFT PANEL: WITHOUT YURO ==================== -->
  <g transform="translate(20, 20)">
    <!-- Card Container -->
    <rect width="440" height="390" rx="12" fill="#161b22" stroke="url(#redBorder)" stroke-width="1.5"/>
    
    <!-- Window Bar -->
    <path d="M 0,12 Q 0,0 12,0 L 428,0 Q 440,0 440,12 L 440,42 L 0,42 Z" fill="#0d1117"/>
    <line x1="0" y1="42" x2="440" y2="42" stroke="#21262d" stroke-width="1"/>
    <circle cx="20" cy="21" r="5.5" fill="#da3633" opacity="0.8"/>
    <circle cx="36" cy="21" r="5.5" fill="#d29922" opacity="0.8"/>
    <circle cx="52" cy="21" r="5.5" fill="#238636" opacity="0.8"/>
    <text x="75" y="26" class="title" fill="#f85149">WITHOUT YURO</text>
    <text x="210" y="26" class="subtitle">Blind Exploration &amp; File Dumps</text>

    <!-- Terminal Content -->
    <!-- Row 1 -->
    <text x="20" y="75" class="mono-cmd" fill="#c9d1d9"><tspan fill="#f85149">$</tspan> grep "app.handle" lib/ -r</text>
    <text x="350" y="75" class="tok-red">380 tok</text>
    <text x="35" y="94" class="mono-comment">↳ 15 matches across 8 files dumped</text>

    <!-- Row 2 -->
    <text x="20" y="130" class="mono-cmd" fill="#c9d1d9"><tspan fill="#f85149">$</tspan> cat lib/application.js</text>
    <text x="335" y="130" class="tok-red">4,120 tok</text>
    <text x="35" y="149" class="mono-comment">↳ 640 lines un-sliced source dump</text>

    <!-- Row 3 -->
    <text x="20" y="185" class="mono-cmd" fill="#c9d1d9"><tspan fill="#f85149">$</tspan> cat lib/router/index.js</text>
    <text x="335" y="185" class="tok-red">4,210 tok</text>
    <text x="35" y="204" class="mono-comment">↳ 650 lines router implementation</text>

    <!-- Row 4 -->
    <text x="20" y="240" class="mono-cmd" fill="#c9d1d9"><tspan fill="#f85149">$</tspan> cat lib/response.js</text>
    <text x="335" y="240" class="tok-red">6,871 tok</text>
    <text x="35" y="259" class="mono-comment">↳ 1,150 lines response class payload</text>

    <!-- Divider Line -->
    <line x1="20" y1="295" x2="420" y2="295" stroke="#30363d" stroke-dasharray="4 4"/>

    <!-- Summary Box -->
    <rect x="20" y="315" width="400" height="55" rx="8" fill="#211215" stroke="#da3633" stroke-width="1"/>
    <text x="35" y="337" class="stat-label" fill="#f85149">TOTAL CONTEXT DUMPED</text>
    <text x="35" y="358" class="stat-val" fill="#ff7b72">15,581 TOKENS</text>
    <!-- Badge -->
    <rect x="270" y="327" width="135" height="30" rx="6" fill="url(#redBadge)"/>
    <text x="337" y="347" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">⚠️ CONTEXT LEAK</text>
  </g>

  <!-- ==================== RIGHT PANEL: WITH YURO ==================== -->
  <g transform="translate(480, 20)">
    <!-- Card Container -->
    <rect width="440" height="390" rx="12" fill="#161b22" stroke="url(#greenBorder)" stroke-width="1.5" filter="url(#glow)"/>
    <rect width="440" height="390" rx="12" fill="#161b22" stroke="url(#greenBorder)" stroke-width="1.5"/>

    <!-- Window Bar -->
    <path d="M 0,12 Q 0,0 12,0 L 428,0 Q 440,0 440,12 L 440,42 L 0,42 Z" fill="#0d1117"/>
    <line x1="0" y1="42" x2="440" y2="42" stroke="#21262d" stroke-width="1"/>
    <circle cx="20" cy="21" r="5.5" fill="#da3633" opacity="0.8"/>
    <circle cx="36" cy="21" r="5.5" fill="#d29922" opacity="0.8"/>
    <circle cx="52" cy="21" r="5.5" fill="#238636" opacity="0.8"/>
    <text x="75" y="26" class="title" fill="#3fb950">WITH YURO</text>
    <text x="180" y="26" class="subtitle">Bounded Graph &amp; Context Engine</text>

    <!-- Terminal Content -->
    <!-- Row 1 -->
    <text x="20" y="75" class="mono-cmd" fill="#c9d1d9"><tspan fill="#3fb950">$</tspan> cbm trace handle</text>
    <text x="350" y="75" class="tok-green">160 tok</text>
    <text x="35" y="94" class="mono-comment">↳ exact 15-node call hierarchy resolved</text>

    <!-- Row 2 -->
    <text x="20" y="145" class="mono-cmd" fill="#c9d1d9"><tspan fill="#3fb950">$</tspan> cbm snippet json</text>
    <text x="350" y="145" class="tok-green">194 tok</text>
    <text x="35" y="164" class="mono-comment">↳ res.json qualified function lines only</text>

    <!-- Row 3 -->
    <text x="20" y="215" class="mono-cmd" fill="#c9d1d9"><tspan fill="#3fb950">$</tspan> rg-mini "X-Powered-By"</text>
    <text x="360" y="215" class="tok-green">33 tok</text>
    <text x="35" y="234" class="mono-comment">↳ 20-line hard-capped pattern lookup</text>

    <!-- Divider Line -->
    <line x1="20" y1="295" x2="420" y2="295" stroke="#30363d" stroke-dasharray="4 4"/>

    <!-- Summary Box -->
    <rect x="20" y="315" width="400" height="55" rx="8" fill="#0f2617" stroke="#238636" stroke-width="1"/>
    <text x="35" y="337" class="stat-label" fill="#3fb950">TOTAL CONTEXT USED</text>
    <text x="35" y="358" class="stat-val" fill="#7ee787">387 TOKENS</text>
    <!-- Badge -->
    <rect x="235" y="327" width="170" height="30" rx="6" fill="url(#greenBadge)"/>
    <text x="320" y="347" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">🚀 -97.5% NET SAVED</text>
  </g>
</svg>
