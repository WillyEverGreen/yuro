[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yuro"
version = "2.0.0"
description = "Yuro - Unified Code Graph Intelligence & Zero-Waste Context Engine for AI Coding Agents"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "tree-sitter>=0.20.0"
]

[project.scripts]
token-save = "utilities.token-save:main"
yuro = "utilities.token-save:main"

[tool.setuptools.packages.find]
where = ["src"]
